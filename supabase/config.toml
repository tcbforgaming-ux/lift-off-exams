project_id = "lift-off-exams-production-rebuild"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55429
major_version = 15

[studio]
enabled = true
port = 55423

[local_smtp]
enabled = true
port = 55424
smtp_port = 55425
pop3_port = 55426

[analytics]
enabled = true
port = 55427

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.stripe-webhook]
verify_jwt = false

[functions.create-customer-portal-session]
verify_jwt = true

[functions.execute-account-deletion]
verify_jwt = false

[functions.start-deca-batch]
verify_jwt = false

[functions.import-deca-batch]
verify_jwt = false

[functions.deliver-moderation-mail]
verify_jwt = false
